substitutions:
  name: my-modbus-gateway

esphome:
  name: ${name}
  friendly_name: My Modbus Gateway

esp32:
  # board: esp32-s3-devkitc-1
  board: esp32-s3-devkitc1-n16r8
  framework:
    type: arduino
    version: recommended

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "Modbus-Gateway-Setup"
    password: "modbus1234"

captive_portal:

web_server:
  port: 8080

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

ota:
  - platform: esphome

external_components:
  - source: github://stephdust/my-modbus-rtu-tcp-gateway
#  - source:
#      type: local
#      path: components
    components: [modbus_gateway]

modbus_gateway:
  id: gateway

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "Adresse IP"
      id: gateway_ip
      icon: mdi:ip-network

    ssid:
      name: "WiFi connecté"
      icon: mdi:wifi

    mac_address:
      name: "Adresse MAC WiFi"
      icon: mdi:network

  - platform: version
    name: "Version ESPHome"
    icon: mdi:information-outline

  - platform: uptime
    name: "Temps de fonctionnement"
    icon: mdi:clock-outline

  - platform: template
    name: "Interface web"
    id: gateway_web_url
    icon: mdi:web
    update_interval: 30s
    lambda: |-
      if (id(gateway_ip).has_state()) {
        return std::string("http://") + id(gateway_ip).state + "/";
      }
      return {};

  - platform: debug
    device:
      name: "Informations matérielles"
    reset_reason:
      name: "Cause du dernier redémarrage"

debug:
  update_interval: 30s

sensor:
    # Température interne ESP32-S3
  - platform: internal_temperature
    name: "Température interne ESP32"
    update_interval: 30s
    entity_category: diagnostic

  # Puissance du signal WiFi en dBm
  - platform: wifi_signal
    name: "Signal WiFi"
    id: wifi_signal_db
    update_interval: 30s
    entity_category: diagnostic

  # Qualité WiFi estimée en %
  - platform: copy
    source_id: wifi_signal_db
    name: "Qualité WiFi"
    filters:
      - lambda: |-
          return clamp(2.0f * (x + 100.0f), 0.0f, 100.0f);
    unit_of_measurement: "%"
    entity_category: diagnostic

  # Uptime en secondes
  - platform: uptime
    name: "Uptime secondes"
    update_interval: 60s
    entity_category: diagnostic

  # Informations processeur et mémoire
  - platform: debug
    free:
      name: "Mémoire RAM disponible"
    block:
      name: "Bloc RAM disponible"
    psram:
      name: "PSRAM disponible"
    cpu_frequency:
      name: "Fréquence CPU"
    loop_time:
      name: "Temps de boucle ESP32"

binary_sensor:
  - platform: status
    name: "État de connexion ESPHome"
    entity_category: diagnostic

button:
  - platform: restart
    name: "Redémarrer la passerelle"
    icon: mdi:restart
    entity_category: diagnostic
