substitutions:
  name: my-modbus-gateway

esphome:
  name: ${name}
  friendly_name: My Modbus Gateway

esp32:
  # board: esp32-s3-devkitc-1
  board: esp32-s3-devkitc1-n16r8
  framework:
    type: arduino
    version: recommended

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Modbus-Gateway-Setup"
    password: "modbus1234"

captive_portal:

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

ota:
  - platform: esphome

external_components:
  - source: github://stephdust/my-modbus-rtu-tcp-gateway
#  - source:
#      type: local
#      path: components
    components: [modbus_gateway]

modbus_gateway:
  id: gateway
